<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carbon Lens — Free Carbon Audit for Indian MSMEs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --g: #1D9E75; --g2: #0f6e56; --g3: #e1f5ee; --g4: #9fe1cb;
  --ink: #0f1c14; --ink2: #3d5247; --ink3: #7a9589;
  --paper: #f7faf8; --card: #ffffff; --edge: #dceee7; --edge2: #c4ddd3;
  --orange: #e8820c; --orange-bg: #fef3e2; --blue: #1a6fbd; --blue-bg: #e8f1fb;
  --purple: #6e3fb3; --purple-bg: #f2ecfc; --red: #c0392b; --red-bg: #fdeaea;
  --radius: 14px; --radius-sm: 8px;
  --shadow: 0 2px 8px rgba(15,28,20,0.06), 0 0 0 1px rgba(15,28,20,0.04);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }
.hidden { display: none !important; }

/* ── NAVIGATION ── */
nav { background: var(--card); border-bottom: 1px solid var(--edge); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.logo { font-size: 18px; font-weight: 600; color: var(--g); display: flex; align-items: center; gap: 8px; }
.logo-icon { width: 28px; height: 28px; background: var(--g); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }

/* ── MAIN PANEL ── */
main { flex: 1; display: flex; justify-content: center; padding: 32px 16px; }
.panel { width: 100%; max-width: 560px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

.form-header { padding: 36px 32px 24px; border-bottom: 1px solid var(--edge); }
.form-body { padding: 24px 32px; }

.field { margin-bottom: 18px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: var(--ink2); margin-bottom: 7px; }
.field input, .field select { width: 100%; height: 44px; padding: 0 14px; border: 1.5px solid var(--edge2); border-radius: var(--radius-sm); font-size: 14px; background: var(--paper); outline: none; }
.field input:focus { border-color: var(--g); background: #fff; }

.submit-btn { width: 100%; height: 52px; background: var(--g); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.submit-btn:hover { background: var(--g2); }

/* ── RESULTS ── */
.hero-band { background: linear-gradient(135deg, #0a3d2b 0%, #0f6e56 60%, #1D9E75 100%); padding: 36px 32px; color: white; position: relative; }
.hero-num { font-size: 64px; font-weight: 300; letter-spacing: -3px; line-height: 1; }
.hero-unit { font-size: 18px; opacity: 0.8; margin-top: 4px; }

.results-body { padding: 28px 32px; }
.bar-row { margin-bottom: 20px; }
.bar-meta { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
.bar-track { height: 8px; background: var(--paper); border-radius: 100px; border: 1px solid var(--edge); overflow: hidden; }
.bar-fill { height: 100%; transition: width 1s ease-out; }

.rec-card { border: 1.5px solid var(--edge); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; display: flex; gap: 14px; }
.rec-num { width: 28px; height: 28px; border-radius: 50%; background: var(--g3); color: var(--g2); font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; margin-right: 5px; }
.b-co2 { background: var(--g3); color: var(--g2); }
.b-money { background: #fef9e7; color: #b5720c; }

footer { text-align: center; padding: 24px; font-size: 12px; color: var(--ink3); background: var(--card); border-top: 1px solid var(--edge); }

/* ── PRINT LOGIC ── */
@media print {
  nav, footer, .btn-row, #formContainer, #resultsContainer { display: none !important; }
  #print-report { display: block !important; padding: 20px; background: white; width: 100%; }
  body { background: white; margin: 0; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}

#print-report { display: none; }
.pr-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
.pr-table th, .pr-table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
</style>
</head>
<body>

<nav>
  <div class="logo"><div class="logo-icon">C</div> Carbon Lens</div>
  <span style="font-size:12px; color:var(--ink3)">India's MSME Auditor</span>
</nav>

<main>
  <div class="panel">
    <div id="formContainer">
      <div class="form-header">
        <h1>Carbon Audit</h1>
        <p>Analyze your business footprint in minutes. Built for Indian MSMEs.</p>
      </div>
      <div class="form-body">
        <form id="auditForm">
          <div class="field"><label>Business Name</label><input type="text" id="businessName" placeholder="e.g. Sharma Textiles" required></div>
          <div class="field">
            <label>Industry</label>
            <select id="businessType" required>
              <option value="Manufacturing">Manufacturing</option>
              <option value="IT">IT / Office</option>
              <option value="Restaurant">Restaurant / Food</option>
              <option value="Textile">Textile / Garments</option>
            </select>
          </div>
          <div class="field">
            <label>Monthly Electricity (kWh)</label>
            <input type="number" id="electricity" placeholder="Check your DISCOM bill" required>
          </div>
          <button type="submit" class="submit-btn">Calculate My Footprint →</button>
        </form>
      </div>
    </div>

    <div id="resultsContainer" class="hidden">
      <div id="resultsContent"></div>
    </div>
  </div>
</main>

<div id="print-report"></div>

<footer>
  Built by Soumya | Udit | Vedant | Vijjval <br> 
  Data: India CEA (0.82 kg CO₂/kWh), GHG Protocol
</footer>

<script>
const auditForm = document.getElementById('auditForm');
let auditResults = {};

auditForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const data = {
    businessName: document.getElementById('businessName').value,
    businessType: document.getElementById('businessType').value,
    electricityKwh: parseFloat(document.getElementById('electricity').value) || 0
  };
  
  const annualElec = (data.electricityKwh * 0.82 * 12) / 1000; 
  const supplyMultiplier = data.businessType === 'Manufacturing' ? 0.4 : 0.2;
  const supplyChain = annualElec * supplyMultiplier;
  const total = annualElec + supplyChain;

  auditResults = { 
    ...data, 
    total: total.toFixed(2), 
    elec: annualElec.toFixed(2), 
    supply: supplyChain.toFixed(2),
    date: new Date().toLocaleDateString('en-IN')
  };

  renderResults();
});

function renderResults() {
  document.getElementById('formContainer').classList.add('hidden');
  document.getElementById('resultsContainer').classList.remove('hidden');
  const pctElec = ((auditResults.elec / auditResults.total) * 100).toFixed(0);

  document.getElementById('resultsContent').innerHTML = `
    <div class="hero-band">
      <div style="text-transform: uppercase; font-size:12px; letter-spacing:1px; opacity:0.8;">${auditResults.businessName}</div>
      <div class="hero-num">${auditResults.total}</div>
      <div class="hero-unit">tonnes CO₂e / year</div>
    </div>
    <div class="results-body">
      <div class="bar-row">
        <div class="bar-meta"><span>Electricity (Scope 2)</span><span>${auditResults.elec} T</span></div>
        <div class="bar-track"><div class="bar-fill" style="background:var(--g); width:${pctElec}%"></div></div>
      </div>
      <div class="rec-card">
        <div class="rec-num">1</div>
        <div>
          <div style="font-weight:600">Switch to BLDC Fans & LEDs</div>
          <div style="margin-top:4px;">
            <span class="badge b-co2">Save ${(auditResults.elec * 0.15).toFixed(1)} T</span>
            <span class="badge b-money">Save ₹12k/yr</span>
          </div>
        </div>
      </div>
      <div class="btn-row" style="margin-top:28px; display:flex; flex-direction:column; gap:10px;">
        <button onclick="downloadPDF()" style="width:100%; height:50px; background:var(--g); color:white; border:none; border-radius:8px; font-weight:600; cursor:pointer;">Download PDF Report</button>
        <button onclick="location.reload()" style="width:100%; height:46px; background:transparent; border:1px solid var(--edge2); border-radius:8px; cursor:pointer;">Start New Audit</button>
      </div>
    </div>
  `;
}

function buildPrintReport() {
  document.getElementById('print-report').innerHTML = `
    <div style="border-bottom: 2px solid #1D9E75; padding-bottom:10px; margin-bottom:20px;">
      <h1 style="color:#1D9E75">Carbon Lens Audit Report</h1>
      <p>Business: <strong>${auditResults.businessName}</strong> | Date: ${auditResults.date}</p>
    </div>
    <table class="pr-table">
      <thead><tr style="background:#f7faf8"><th>Source</th><th>Scope</th><th>Tonnes CO₂e/yr</th></tr></thead>
      <tbody>
        <tr><td>Electricity</td><td>2</td><td>${auditResults.elec}</td></tr>
        <tr><td>Supply Chain</td><td>3</td><td>${auditResults.supply}</td></tr>
        <tr style="font-weight:700"><td>Total</td><td></td><td>${auditResults.total}</td></tr>
      </tbody>
    </table>
  `;
}

function downloadPDF() {
  buildPrintReport();
  window.print();
}
</script>
</body>
</html>
